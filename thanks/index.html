<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071421">
<title>Thank You | B4 Indicators</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@200..700&display=swap">
<style>
:root{--navy:#071421;--teal:#13bba4;--teal2:#087d73;--line:#28475a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(120deg,#06121f,#0a2537 70%,#0a353d);color:#e3eef2;font:16px/1.6 "Raleway",-apple-system,"Segoe UI",sans-serif;padding:24px 16px}
.card{width:min(560px,100%);background:#0b1b27;border:1px solid var(--line);border-radius:20px;padding:30px 28px;box-shadow:0 30px 80px #0008;text-align:center}
.mark{width:46px;height:46px;margin:0 auto 14px;display:grid;place-items:center;border-radius:13px;background:var(--navy);color:#59e2cd;border:1px solid #285a61;font-weight:700;letter-spacing:.1em}
h1{font-weight:300;font-size:32px;line-height:1.15;margin:0 0 10px}h1 em{font-style:normal;color:#5ee4cf}
p{color:#b9cbd4;margin:0 0 14px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
a.btn{display:inline-flex;border-radius:999px;background:var(--teal);color:#06231f;padding:11px 20px;font-weight:600;text-decoration:none;border:1px solid var(--teal)}
a.btn.line{background:transparent;color:#d3e6ea;border-color:var(--line)}a.btn:hover{background:#6ce8d4;border-color:#6ce8d4;color:#06231f}
small{display:block;color:#7f97a3;margin-top:16px;font-size:13px}
</style>
</head>
<body>
<main class="card">
<div class="mark">B4</div>
<h1>Thank you. <em>You're in.</em></h1>
<p id="msg">Your free B4 Developer Kit links are on their way to your inbox. Downloads are now unlocked in this browser.</p>
<div class="btns" id="btns"><a class="btn" href="/studio/">Open B4 Studio</a><a class="btn line" href="/repository/">Browse the repository</a><a class="btn line" href="/">Developer kit</a></div>
<small>Can't find the email? Check your spam or promotions folder, or write to <a href="mailto:info@b4signals.com" style="color:#5ee4cf">info@b4signals.com</a>.</small>
</main>
<script>
(function(){
  // unlock downloads in this browser, then return the visitor to the page they came from (same site only) to finish their download
  try{ localStorage.setItem('b4studio-unlocked', String(Date.now())); }catch(e){}
  var j=null; try{ j=JSON.parse(localStorage.getItem('b4return')||'null'); }catch(e){}
  if(!j || !j.url || Date.now()-j.t > 2*3600e3) return;
  var u; try{ u=new URL(j.url, location.href); }catch(e){ return; }
  if(u.origin!==location.origin) return;            // never redirect off this site
  u.searchParams.set('unlocked','1');
  document.getElementById('msg').textContent='Thanks for signing up! Taking you back to finish your download…';
  var back=document.createElement('a'); back.className='btn'; back.href=u.href; back.textContent='Back to my download';
  var b=document.getElementById('btns'); b.insertBefore(back, b.firstChild);
  setTimeout(function(){ location.replace(u.href); }, 1200);
})();
</script>
</body>
</html>
